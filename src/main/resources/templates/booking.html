
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Train Ticket</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8efff, #f5f7fb);
            color: #263238;
            padding: 35px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #102a56;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 15px;
        }

        /* Main Container */
        .booking-container {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 25px;
            align-items: start;
        }

        /* Train Information Card */
        .train-info {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #1769aa;
        }

        .train-info h2,
        .booking-form h2 {
            color: #102a56;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item span {
            color: #718096;
            font-size: 14px;
        }

        .info-item strong {
            color: #263238;
            font-size: 14px;
            text-align: right;
            overflow-wrap: anywhere;
        }

        /* Booking Form Card */
        .booking-form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #1769aa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #34445a;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5dce7;
            border-radius: 8px;
            font-size: 14px;
            background: #fbfcff;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #1769aa;
            background: white;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
        }

        .form-group small {
            display: block;
            margin-top: 7px;
            color: #718096;
            font-size: 12px;
        }

        /* Error Message */
        .error-message {
            background: #fff0f0;
            color: #c62828;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #1769aa, #102a56);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 42, 86, 0.2);
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Back Button */
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            padding: 12px;
            border: 1px solid #1769aa;
            border-radius: 8px;
            color: #1769aa;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #1769aa;
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 750px) {
            body {
                padding: 20px 14px;
            }

            .booking-container {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 27px;
            }

            .train-info,
            .booking-form {
                padding: 23px 20px;
            }
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>Railway Ticket Booking</h1>
        <p>Complete your details to confirm your journey</p>
    </div>

    <div class="booking-container">

        <!-- Train Details -->
        <div class="train-info">

            <h2>Train Details</h2>

            <div class="info-item">
                <span>Train Name</span>
                <strong th:text="${train.trainName}"></strong>
            </div>

            <div class="info-item">
                <span>Train Number</span>
                <strong th:text="${train.trainNumber}"></strong>
            </div>

            <div class="info-item">
                <span>Source</span>
                <strong th:text="${train.source}"></strong>
            </div>

            <div class="info-item">
                <span>Destination</span>
                <strong th:text="${train.destination}"></strong>
            </div>

            <div class="info-item">
                <span>Total Seats</span>
                <strong th:text="${train.totalSeats}"></strong>
            </div>

            <div class="info-item">
                <span>Available Seats</span>
                <strong th:text="${remainingSeats}"
                        style="color: green;">
                </strong>
            </div>

        </div>

        <!-- Booking Form -->
        <div class="booking-form">

            <h2>Passenger Details</h2>

            <p class="error-message"
               th:if="${error}"
               th:text="${error}">
            </p>

            <form th:action="@{/book}" method="post">

                <input type="hidden"
                       name="trainId"
                       th:value="${train.id}">

                <div class="form-group">
                    <label>Passenger Name</label>
                    <input type="text"
                           name="passengerName"
                           placeholder="Enter passenger name"
                           required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email"
                           name="email"
                           placeholder="Enter email address"
                           required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number"
                           name="age"
                           min="1"
                           max="120"
                           placeholder="Enter age"
                           required>
                </div>

                <div class="form-group">
                    <label>Number of Seats</label>

                    <input type="number"
                           id="numberOfSeats"
                           name="numberOfSeats"
                           min="1"
                           max="6"
                           th:max="${remainingSeats < 6 ? remainingSeats : 6}"
                           value="1"
                           required>

                    <small>Maximum 6 seats per booking.</small>
                </div>

                <div class="form-group">
                    <label>Journey Date</label>
                    <input type="date"
                           name="journeyDate"
                           th:value="${journeyDate}"
                           required>
                </div>

                <button type="submit"
                        class="submit-btn"
                        th:disabled="${remainingSeats <= 0}">
                    Book Ticket
                </button>

            </form>

            <a th:href="@{/}" class="back-btn">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
