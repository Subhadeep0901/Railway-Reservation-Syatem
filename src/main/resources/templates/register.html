
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passenger Registration | Railway</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8efff, #f5f7fb);
            padding: 25px 15px;
            color: #263238;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 38px 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #1769aa;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #102a56;
            font-size: 27px;
            margin-bottom: 9px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #34445a;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5dce7;
            border-radius: 8px;
            font-size: 14px;
            background: #fbfcff;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1769aa;
            background: white;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
        }

        .error-message {
            background: #fff0f0;
            color: #c62828;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #1769aa, #102a56);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 42, 86, 0.2);
        }

        .login-text {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #718096;
        }

        a {
            color: #1769aa;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: #102a56;
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 11px;
            border: 1px solid #1769aa;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #1769aa;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 28px 22px;
            }

            .header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="header">
            <h1>Create Account</h1>
            <p>Register to start your railway journey</p>
        </div>

        <p class="error-message"
           th:if="${error}"
           th:text="${error}">
        </p>

        <form th:action="@{/register}" method="post">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text"
                       name="name"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       placeholder="Enter your email address"
                       required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel"
                       name="phone"
                       placeholder="Enter your phone number"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       minlength="8"
                       placeholder="Create a password (minimum 8 characters)"
                       required>
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a th:href="@{/passenger/login}">Login here</a>
        </p>

        <a th:href="@{/}" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>
</html>
